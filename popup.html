<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 16px;
        font-family: Arial, sans-serif;
        background: #1e2733;
        color: #fff;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .label {
        font-size: 14px;
      }
      /* toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 46px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #55606e;
        border-radius: 24px;
        transition: 0.2s;
      }
      .slider:before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: #2f9e44;
      }
      input:checked + .slider:before {
        transform: translateX(22px);
      }
      p {
        font-size: 12px;
        color: #aab4c0;
        margin: 12px 0 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>AnimeWorld Auto Next</h1>
    <div class="row">
      <span class="label">Cambio episodio automatico</span>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <p>
      Quando l'episodio finisce, passa da solo al successivo. Funziona sulle
      pagine di riproduzione di AnimeWorld.
    </p>
    <p id="version" style="color: #6b7684; margin-top: 8px"></p>
    <script src="popup.js"></script>
  </body>
</html>
